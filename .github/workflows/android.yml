name: Build, test and smoke-run APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      - name: Unit tests (world generator, meshes, atmosphere)
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee test.log

      - name: APK info
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -l $APK
          sha256sum $APK | tee apk-sha256.txt
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | sort -V | tail -1)
          $AAPT dump badging $APK | head -20 | tee apk-badging.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on tablet emulator and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_c
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/smoke.sh

      - name: Collect results
        if: always()
        run: |
          mkdir -p results
          cp -r ci-out/* results/ 2>/dev/null || true
          cp build.log test.log apk-sha256.txt apk-badging.txt results/ 2>/dev/null || true
          ls -l app/build/outputs/apk/debug/ > results/apk-listing.txt 2>&1 || true
          cp -r app/build/reports/tests results/test-report 2>/dev/null || true
          echo "${GITHUB_SHA}" > results/commit.txt
          echo "${{ job.status }}" > results/job-status.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: life-engine-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            results/

      - name: Publish results branch (screenshots + logs)
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd results
          git init -q
          git checkout -q -b ci-results
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "CI results for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results

      - name: Publish debug APK release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: LIFE ENGINE – latest debug build
          prerelease: true
          make_latest: true
          body: |
            Debug APK built from ${{ github.sha }} by GitHub Actions and smoke-tested on an Android tablet emulator.
            Install: download `app-debug.apk` on the tablet, open it, allow "Install unknown apps" for your browser/files app.
          files: app/build/outputs/apk/debug/app-debug.apk
